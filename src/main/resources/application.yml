server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: course-project-agent
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      chat:
        options:
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
    mcp:
      client:
        enabled: false

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md,docx,pdf

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}
  embedding:
    model: text-embedding-v4

document:
  chunk:
    max-size: 800
    overlap: 100
  mcp:
    enabled: true
    python-path: ./.venv-document-mcp/Scripts/python.exe
    server-script-path: ./document-mcp-server/server.py
    transport: sse
    host: 127.0.0.1
    port: 18080
    sse-endpoint: /sse
    log-level: INFO
    output-path: ./generated-reports
    timeout-ms: 120000
    startup-timeout-ms: 30000

rag:
  top-k: 3
  collection-name: course_project_knowledge

course-project:
  default-topic: 校园二手交易平台
  default-tech-stack:
    - Spring Boot
    - Vue
    - MySQL

course-chat:
  max-history-messages: 12
  enable-tools: true
  default-conversation-prefix: course-chat

course-project-agent:
  enable-tools: true
  default-request-prefix: course-project

artifact-generation:
  enable-llm-draft: true
